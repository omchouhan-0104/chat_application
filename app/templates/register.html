<!DOCTYPE html>

<html>

<head>

    <title>Register</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f4f4;
        }

        .container {
            width: 350px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Create Account</h2>

    <input
        id="username"
        placeholder="Username"
    >

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

    <button onclick="register()">
        Register
    </button>

    <p id="message"></p>

</div>


<script>

async function register() {

    const username =
        document.getElementById(
            "username"
        ).value;

    const email =
        document.getElementById(
            "email"
        ).value;

    const password =
        document.getElementById(
            "password"
        ).value;


    const response = await fetch(
        "/auth/register",
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                username,
                email,
                password
            })
        }
    );


    const data = await response.json();


    document.getElementById(
        "message"
    ).innerText =
        data.message || data.detail;


    if (response.ok) {

        setTimeout(
            () => {
                window.location.href = "/";
            },
            1000
        );

    }

}

</script>

</body>

</html>
